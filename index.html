<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Steam to Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Silkscreen:wght@400;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#15120e; --panel:#1d1a15; --panel2:#25211b; --line:#3a332a; --line2:#4a4136;
  --text:#ede6da; --muted:#a99f90; --faint:#71685b;
  --acc:#d19a48; --acc-ink:#1b1207; --acc-soft:rgba(209,154,72,.14);
  --good:#8cc784; --warn:#e3a53c; --bad:#e56e57;
  --display:"Pixelify Sans","Silkscreen","Courier New",monospace;
  --pixel:"Silkscreen","Pixelify Sans","Courier New",monospace;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
body[data-era="1"]{--acc:#e8c65e;--acc-soft:rgba(232,198,94,.13)}
body[data-era="2"]{--acc:#5fd3b0;--acc-ink:#06201a;--acc-soft:rgba(95,211,176,.13);--bg:#10141a;--panel:#171c22;--panel2:#1d232b;--line:#2c353f;--line2:#3a4550}
body[data-era="3"]{--acc:#6cb8ff;--acc-ink:#061526;--acc-soft:rgba(108,184,255,.13);--bg:#0d1019;--panel:#151a26;--panel2:#1b2130;--line:#2a3246;--line2:#374157}
body[data-era="4"]{--acc:#f2955e;--acc-ink:#2a1105;--acc-soft:rgba(242,149,94,.13);--bg:#0c0e17;--panel:#141824;--panel2:#1a1f2e;--line:#292f43;--line2:#363e55}
body[data-era="5"]{--acc:#b9a2ff;--acc-ink:#170c33;--acc-soft:rgba(185,162,255,.14);--bg:#0a0a14;--panel:#12121f;--panel2:#191929;--line:#28283f;--line2:#35354f}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);transition:background-color .8s}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
.app{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:grid;gap:12px}

/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px}
.brand div{display:flex;flex-direction:column;line-height:1}
.brand b{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.brand b span{color:var(--acc)}
.brand small{color:var(--faint);font:11px var(--pixel);letter-spacing:.04em;text-transform:uppercase;margin-top:5px}
.date{display:flex;align-items:baseline;gap:8px;padding:4px 14px;border-left:2px solid var(--line);border-right:2px solid var(--line)}
.date .mon{font:600 18px/1 var(--display);color:var(--muted)}
.date .yr{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.date .era{font:12px/1 var(--pixel);color:var(--acc);text-transform:uppercase;margin-left:4px}
.speed{display:flex;border:2px solid var(--line2);border-radius:3px;overflow:hidden}
.speed button{background:transparent;border:0;border-right:2px solid var(--line2);padding:6px 11px;font:500 13px var(--mono);color:var(--muted)}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.hdr .spacer{flex:1}
.ghost{background:transparent;border:2px solid var(--line2);border-radius:3px;padding:6px 12px;color:var(--muted);font-size:13px}
.ghost:hover{color:var(--text);border-color:var(--muted)}
.goal{display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--text)}
.goal .lbl{font:11px var(--pixel);color:var(--acc-ink);background:var(--acc);padding:2px 6px;border-radius:2px}

/* ribbon */
.ribbon{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--faint)}
.bar{position:relative;flex:1;height:6px;background:var(--panel2)}
.bar .fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px)}
.bar .mk{position:absolute;top:50%;width:9px;height:9px;background:var(--bg);border:2px solid var(--acc);transform:translate(-50%,-50%) rotate(45deg)}
.bar .now{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text);transform:translateX(-1px)}
.eras{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--faint)}
.eras span b{font-weight:600;color:var(--muted)}
.eras span.cur b{color:var(--acc)}

/* layout */
.main{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;gap:12px;align-items:start}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr) 300px}.ledger{grid-column:1/-1}}
@media (max-width:780px){.main{grid-template-columns:minmax(0,1fr)}.date .yr{font-size:32px}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px}
.side{display:grid;gap:12px}
h2{font:700 12px/1 var(--pixel);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;gap:8px}

/* ledger */
.ledger{padding-bottom:8px}
.ledger .inner{display:grid;gap:4px}
@media (max-width:1100px) and (min-width:781px){.ledger .inner{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}}
.stats{display:grid;gap:2px;padding:0 14px 10px;border-bottom:2px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 0;font-size:14px}
.row .k{color:var(--muted)}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.row .r{font-family:var(--mono);font-size:11.5px;min-width:52px;text-align:right;color:var(--faint)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}.warn{color:var(--warn)!important}
.res{padding:8px 14px 10px;border-bottom:2px solid var(--line)}
.res .row .k{flex:1}
.res .row .v{min-width:56px;text-align:right}
.deps{padding:8px 14px 4px}
.sub{font:10.5px var(--pixel);letter-spacing:.03em;color:var(--faint);text-transform:uppercase;margin:6px 0 4px}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:1px}

/* tabs */
.ops{min-height:400px}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:9px 14px 9px;font:600 17px var(--display);text-transform:uppercase;color:var(--faint);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--acc)}
.tabs button .badge{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;background:var(--acc);color:var(--acc-ink);font:600 11px/18px var(--mono);text-align:center}
.tb{padding:14px}
.cat{margin:4px 0 16px}
.cat h3{font:11px var(--pixel);text-transform:uppercase;color:var(--faint);margin:0 0 8px;display:flex;align-items:center;gap:10px}
.cat h3::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 6px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.card.done{opacity:.55}
.card.locked{opacity:.6}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h4{margin:0;font:600 16px/1.2 var(--body);display:flex;align-items:center;gap:8px}
.card-h h4 img{width:32px;height:32px;flex:none}
.count{font:500 13px var(--mono);color:var(--acc)}
.io{font:12px/1.5 var(--mono);color:var(--muted);margin:0}
.io b{color:var(--text);font-weight:500}
.desc{font-size:13px;color:var(--muted);margin:0}
.costs{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11.5px/1 var(--mono);padding:4px 6px;border-radius:2px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.lack{color:var(--bad);border-color:rgba(229,110,87,.4)}
.chip.ok{color:var(--good);border-color:rgba(140,199,132,.35)}
.card-f{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.time{font:12px var(--mono);color:var(--faint)}
.card-f .grow{flex:1}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:2px;padding:7px 13px;font:600 13px var(--body);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:active{box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.btn:disabled{background:var(--panel);color:var(--faint);border:1px solid var(--line);cursor:not-allowed;filter:none;box-shadow:none}
.stepper{display:flex;align-items:center;border:2px solid var(--line2);border-radius:2px}
.stepper button{background:transparent;border:0;width:26px;height:26px;color:var(--muted)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper span{font:12px var(--mono);min-width:44px;text-align:center;color:var(--text)}
.why{font-size:12px;color:var(--warn);margin:0}
.state{font-size:12px;margin:0;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:65ch}
.hist{font:11px var(--mono);color:var(--faint)}
.donelist{display:flex;flex-wrap:wrap;gap:6px}

/* queue */
.queue ol{list-style:none;margin:0;padding:0 10px 10px;display:grid;gap:6px}
.q{border:2px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--panel2);display:grid;gap:6px}
.q.wait{background:transparent;border-style:dashed}
.q-top{display:flex;gap:8px;align-items:center}
.q-top img{width:24px;height:24px;flex:none}
.kind{font:9.5px var(--pixel);color:var(--acc)}
.q.wait .kind{color:var(--faint)}
.q-name{flex:1;font-size:14px;font-weight:500}
.q-left{font:12px var(--mono);color:var(--muted)}
.q-bot{display:flex;gap:6px;align-items:center}
.prog{flex:1;height:6px;background:var(--panel)}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 4px,transparent 4px 5px);transition:width .2s}
.ic{background:transparent;border:1px solid var(--line);border-radius:2px;width:24px;height:22px;font-size:11px;color:var(--muted);line-height:1}
.ic:hover{color:var(--text);border-color:var(--muted)}
.ic:disabled{opacity:.3;cursor:default}
.empty{color:var(--faint);font-size:13px;padding:0 14px 14px;margin:0}
.crews{font:12px var(--mono);color:var(--muted)}
.log ol{list-style:none;margin:0;padding:0 14px 12px;display:grid;gap:5px;max-height:320px;overflow-y:auto}
.log li{font-size:13px;color:var(--muted);display:grid;grid-template-columns:62px 1fr;gap:6px}
.log li time{font:11px/1.8 var(--mono);color:var(--faint)}
.log li.big{color:var(--text)}

/* launch */
.section{margin-bottom:18px}
.mods{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;border:2px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--panel2)}
.mod.ok{border-color:var(--acc)}
.mod h4{margin:0;font:600 15px var(--body)}
.mod .costs{grid-column:1/-1}
.tag{font:10px var(--pixel);padding:3px 7px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.voy{border:2px solid var(--line);border-radius:3px;padding:10px 12px;display:grid;gap:6px;background:var(--panel2);margin-bottom:8px}

/* modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(5,5,10,.72);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--panel);border:3px solid var(--acc);border-radius:4px;max-width:520px;width:100%;padding:22px;display:grid;gap:12px}
.dlg h3{margin:0;font:700 30px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* map */
.mapbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.seg{display:flex;border:2px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;border-right:2px solid var(--line2);padding:6px 11px;font:600 15px var(--display);text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button img{width:24px;height:24px}
.zoom .zl{font:12px var(--mono);min-width:48px;text-align:center;align-self:center;color:var(--muted)}
.zoom button{font-family:var(--mono);font-size:15px;padding:5px 11px}
.drivebar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px;padding:8px 10px;background:var(--panel2);border:2px solid var(--line);border-radius:3px}
.drivebar .lbl{font:10.5px var(--pixel);color:var(--faint);text-transform:uppercase}
.drivebar .grow{flex:1}
.fuel{font:12px var(--mono);color:var(--muted)}
.placing{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;border:2px solid var(--acc);border-radius:3px;background:var(--acc-soft);font-size:14px;margin-bottom:8px}
.placing b{color:var(--acc)}
.placing .msg{color:var(--warn);font-size:13px}
.placing .grow{flex:1}
.placing img{width:28px;height:28px}
@media (max-width:560px){.drivebar .seg button span{display:none}.drivebar .seg button{padding:5px 9px}}
#mapview{position:relative;border:2px solid var(--line);border-radius:3px;overflow:hidden;background:#0b1622;user-select:none;-webkit-user-select:none}
#mapview canvas{display:block;width:100%;touch-action:none;cursor:pointer}
#mapview.panning canvas{cursor:grabbing}
.toast{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);background:#0e0d0b;border:2px solid var(--acc);color:#fff;font:12px/1.4 var(--pixel);padding:6px 10px;pointer-events:none;text-transform:uppercase}
.toast[hidden]{display:none}
.hint{position:absolute;right:8px;bottom:8px;font:10px var(--pixel);color:rgba(255,255,255,.75);background:rgba(0,0,0,.45);padding:3px 6px;pointer-events:none;text-transform:uppercase}
.regions{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.regions button{background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.regions button[aria-pressed="true"]{border-color:var(--acc);color:var(--text)}
.regions button.fog{border-style:dashed}
.rp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;border-top:2px solid var(--line);padding-top:14px}
@media (max-width:900px){.rp{grid-template-columns:minmax(0,1fr)}}
.rp h3{margin:2px 0 6px;font:700 28px/1 var(--display);text-transform:uppercase}
.eyebrow{font:10.5px var(--pixel);text-transform:uppercase;color:var(--acc)}
.trait{display:flex;gap:8px;align-items:baseline;font-size:13.5px;margin:8px 0;padding:8px 10px;background:var(--panel2);border:2px solid var(--line);border-radius:3px}
.trait .tag{flex:none}
.blk{display:grid;gap:3px;margin:10px 0}
.meter{height:8px;background:var(--panel2);border:1px solid var(--line);margin:4px 0 2px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 4px,transparent 4px 5px)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hb:last-child{border-bottom:0}
.hb .nm{font-size:14px;display:flex;align-items:center;gap:8px}
.hb .nm img{width:28px;height:28px;flex:none}
.hb .nm small{color:var(--faint);font:11.5px var(--mono)}
.hb .costs,.hb .why,.hb .state,.hb .io{grid-column:1/-1}
.bh{max-height:520px;overflow-y:auto;padding-right:4px}
.tip[hidden]{display:none}
.tip{position:fixed;z-index:20;pointer-events:none;max-width:290px;background:#0e0d0b;color:#efe9dd;border:2px solid var(--acc);border-radius:2px;padding:8px 10px;display:grid;gap:2px;font-size:12.5px;line-height:1.35;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.tip b{font:600 16px var(--display);text-transform:uppercase;color:#fff}
.tip span{color:#c9c0b0}
.key{margin-top:10px;border:2px solid var(--line);border-radius:3px;background:var(--panel2)}
.key summary{cursor:pointer;padding:9px 12px;font:600 16px var(--display);text-transform:uppercase;color:var(--muted)}
.key summary span{font:400 12px var(--body);text-transform:none;color:var(--faint);margin-left:10px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px;padding:2px 12px 12px}
.kcol{display:grid;gap:6px;align-content:start}
.krow{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center}
.krow img,.krow i{width:32px;height:32px;background:#2a3a24;display:block}
.krow b{display:block;font-size:13px;font-weight:600}
.krow span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
/* research tree */
.rhead{font-size:14px;color:var(--muted);margin-bottom:10px}
.rhead b{color:var(--text);font-family:var(--mono);font-weight:500}
.tdet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:12px 14px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;margin-bottom:12px}
@media (max-width:760px){.tdet{grid-template-columns:minmax(0,1fr)}}
.tdet h3{margin:2px 0 2px;font:700 26px/1.05 var(--display);text-transform:uppercase}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.tcols{grid-template-columns:1fr}}
.fx{margin:0 0 6px;padding-left:16px;font-size:13px;color:var(--good)}
.fx li{margin:2px 0}
.fx.unl{list-style:none;padding:0;color:var(--text)}
.fx .un{display:flex;align-items:center;gap:6px}
.fx .un img{width:24px;height:24px}
.rqs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.rq{background:var(--panel);border:1px solid var(--line2);border-radius:2px;padding:3px 7px;font-size:12px;color:var(--muted)}
.rq.ok{color:var(--good);border-color:rgba(140,199,132,.4)}
.flegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.flegend i{display:inline-block;width:9px;height:9px;margin-right:5px}
.treewrap{overflow-x:auto;border:2px solid var(--line);border-radius:3px;background:var(--bg)}
.tree{position:relative;display:grid;grid-template-columns:repeat(6,minmax(158px,1fr));gap:0 34px;padding:10px 14px 14px;min-width:1100px}
#treelines{position:absolute;left:0;top:0;pointer-events:none}
.tcol{display:flex;flex-direction:column;gap:6px}
.thead{font:11px var(--pixel);text-transform:uppercase;color:var(--faint);padding:2px 0 6px;display:flex;justify-content:space-between}
.tn{position:relative;display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:7px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:2px;padding:5px 7px 5px 5px;font-size:12.5px;line-height:1.2;color:var(--muted)}
.tn i{align-self:stretch;min-height:14px}
.tn-c{font:11px var(--mono);color:var(--faint)}
.tn.st-done{background:var(--acc-soft);border-color:var(--acc);color:var(--text)}
.tn.st-done .tn-c{color:var(--acc)}
.tn.st-ready{border-color:var(--good);color:var(--text);box-shadow:0 0 0 2px rgba(140,199,132,.18)}
.tn.st-ready .tn-c{color:var(--good)}
.tn.st-open{color:var(--text)}
.tn.st-locked{opacity:.5}
.tn.sel{outline:2px solid var(--text);outline-offset:1px;opacity:1}
.tn:hover{border-color:var(--muted)}
/* ---- Research schedule (CPM) ---- */
.rtabs{display:inline-flex;border:2px solid var(--line2);border-radius:3px;overflow:hidden;margin-left:auto}
.rtabs button{background:transparent;border:0;border-right:2px solid var(--line2);padding:6px 14px;font:11px var(--pixel);text-transform:uppercase;color:var(--muted)}
.rtabs button:last-child{border-right:0}
.rtabs button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.plan-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 12px}
@media (max-width:700px){.plan-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plan-sum div{background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:8px 10px}
.plan-sum small{display:block;font:10px var(--pixel);text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.plan-sum b{font:600 20px/1.1 var(--mono);color:var(--text)}
.plan-sum b.acc{color:var(--acc)}
.plan-sum span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.plan-target{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;margin-bottom:12px}
.plan-target h3{margin:0;font:700 24px/1.05 var(--display);text-transform:uppercase}
.plan-target .grow{flex:1}
.goals{display:flex;flex-wrap:wrap;gap:4px;margin:-4px 0 12px;align-items:center}
.goals .lbl{font:10px var(--pixel);text-transform:uppercase;color:var(--faint);margin-right:4px}
.goals .rq[aria-pressed="true"]{border-color:var(--acc);color:var(--text)}
.gantt{position:relative;border:2px solid var(--line);border-radius:3px;background:var(--bg);padding:6px 12px 10px}
#planlines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.g-axis,.g-row{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr) 104px;gap:10px;align-items:center}
.g-axis{font:10px var(--mono);color:var(--faint);padding:4px 0 6px;border-bottom:1px solid var(--line)}
.g-ticks{position:relative;height:14px}
.g-ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.g-ticks span:first-child{transform:none}
.g-ticks span:last-child{transform:translateX(-100%)}
.g-row{padding:5px 0;border-bottom:1px dashed var(--line)}
.g-row:last-child{border-bottom:0}
.g-name{display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.2;color:var(--text);min-width:0}
.g-name i{flex:none;width:6px;align-self:stretch;min-height:14px}
.g-name small{display:block;font:10.5px var(--mono);color:var(--faint);margin-top:2px}
.g-track{position:relative;height:20px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.g-bar{position:absolute;top:3px;height:14px;min-width:4px;border-radius:2px;opacity:.85}
.g-row.crit .g-bar{opacity:1;box-shadow:0 0 0 2px var(--acc)}
.g-row.crit .g-name{font-weight:600}
.g-row.now .g-bar{background:repeating-linear-gradient(90deg,var(--good) 0 3px,transparent 3px 5px)!important}
.g-days{font:11.5px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.g-days b{color:var(--text);font-weight:500}
.g-row .tag.crit{font:9px var(--pixel);padding:2px 4px;border-radius:2px;background:var(--acc);color:var(--acc-ink);text-transform:uppercase}
.plan-note{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.plan-note b{color:var(--text)}
.plan-empty{padding:18px;text-align:center;color:var(--muted);background:var(--panel2);border:2px solid var(--line);border-radius:3px}
@media (max-width:640px){
  .g-axis,.g-row{grid-template-columns:minmax(0,1fr) 96px;gap:4px 8px}
  .g-axis>span:first-child{display:none}
  .g-name{grid-column:1/-1}
  .g-track{grid-column:1}
  .g-ticks span:not(:first-child):not(:last-child){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== screen layout ===== */
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh}
[hidden]{display:none!important}
.screen{flex:1;min-height:0;position:relative}
.page{overflow-y:auto;-webkit-overflow-scrolling:touch}
.pagebody{max-width:1240px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:12px;align-content:start}
.pagebody.wide{max-width:1440px}
.ph h1{font:700 28px/1 var(--display);text-transform:uppercase;margin:0}

/* banner */
.banner{flex:none;background:#0e0c0a;border-bottom:2px solid var(--line);padding:6px 12px 6px;display:grid;gap:4px;z-index:5}
.bn-row{display:flex;align-items:center;gap:8px 14px;min-width:0}
.bn-brand{display:flex;align-items:center;gap:8px;flex:none}
.bn-brand img{width:30px;height:30px}
.bn-brand b{font:700 19px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.bn-brand b span{color:var(--acc)}
.bn-date{display:flex;align-items:baseline;gap:6px;flex:none}
.bn-date .yr{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.bn-date .mon{font:600 14px/1 var(--display);color:var(--muted)}
.bn-date .era{font:10px/1 var(--pixel);color:var(--acc);text-transform:uppercase}
.bn-speed{display:flex;border:2px solid var(--line2);border-radius:3px;overflow:hidden;flex:none}
.bn-speed button{background:transparent;border:0;border-right:2px solid var(--line2);padding:4px 8px;font:500 12px var(--mono);color:var(--muted)}
.bn-speed button:last-child{border-right:0}
.bn-speed button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.bn-res{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.bn-res::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:baseline;gap:5px;padding:3px 7px;border:1px solid var(--line);border-radius:2px;background:var(--panel);font:12px var(--mono);white-space:nowrap}
.rc .n{font:10px var(--pixel);color:var(--faint);text-transform:uppercase}
.rc .d{font-size:10.5px;color:var(--faint)}
.rc.alert{border-color:rgba(229,110,87,.6)}
.rc.click{cursor:pointer;color:inherit}
.rc.click:hover{border-color:var(--muted)}
.bn-nav{display:flex;gap:2px;flex:none}
.bn-nav button{background:transparent;border:0;border-bottom:3px solid transparent;padding:5px 10px 4px;font:600 15px var(--display);text-transform:uppercase;color:var(--faint);white-space:nowrap}
.bn-nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--acc)}
.bn-nav .badge{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;background:var(--acc);color:var(--acc-ink);font:600 10px/16px var(--mono);text-align:center}
.bn-goal{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bn-goal .lbl{font:10px var(--pixel);color:var(--acc-ink);background:var(--acc);padding:1px 5px;border-radius:2px;margin-right:6px}
@media (max-width:900px){
  .banner{padding:5px 8px}
  .bn-brand b{display:none}
  .bn-row.top{flex-wrap:wrap}
  .bn-res{order:5;flex-basis:100%}
  .bn-nav{margin-left:auto}
  .bn-nav button{padding:4px 7px;font-size:13px}
  .bn-date .yr{font-size:20px}
  .bn-speed button{padding:3px 6px}
}
@media (max-width:520px){ .bn-brand{display:none} .bn-goal{font-size:11.5px} .rc{padding:2px 6px} .bn-date .era{display:none} .bn-speed button{padding:3px 5px;font-size:11px} .bn-nav button{padding:4px 5px;font-size:12px} }

/* map screen */
.mapscreen{display:flex}
.sidebar{flex:none;width:84px;background:#0e0c0a;border-right:2px solid var(--line);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;padding:6px 6px 12px;scrollbar-width:thin}
.sb-h{font:9.5px var(--pixel);text-transform:uppercase;color:var(--faint);text-align:center;margin:6px 0 2px}
.sb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:5px 2px 4px;font:600 11px/1.1 var(--display);text-transform:uppercase;color:var(--muted)}
.sb img{width:44px;height:44px;object-fit:contain}
.sb:hover{border-color:var(--muted);color:var(--text)}
.sb[aria-pressed="true"],.sb[aria-expanded="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--text)}
.sb:disabled{opacity:.35;cursor:not-allowed}
.sb .nb{position:absolute;top:2px;right:3px;font:600 9.5px var(--mono);color:var(--acc)}
.sb.sm{flex-direction:row;justify-content:center;padding:5px 2px;font-size:11px}
.sb-pair{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.sb-pair .sb{padding:5px 0;font-size:10px}
.maparea{position:relative;flex:1;min-width:0;overflow:hidden;background:#0b1622}
#mapview{position:absolute;inset:0;border:0;border-radius:0}
#mapview canvas{height:100%}
.flyout{position:absolute;left:0;top:0;bottom:0;width:360px;max-width:calc(100% - 12px);z-index:4;background:rgba(21,18,14,.97);border-right:2px solid var(--acc);display:flex;flex-direction:column;box-shadow:6px 0 0 rgba(0,0,0,.35)}
.fo-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2px solid var(--line)}
.fo-h h2{font:700 20px/1 var(--display);color:var(--text);flex:1}
.fo-h img{width:32px;height:32px}
.fo-b{overflow-y:auto;padding:8px 10px 16px;display:grid;gap:8px;align-content:start}
.fo-note{font-size:12.5px;color:var(--muted);margin:0 2px}
.fr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;background:var(--panel2);border:2px solid var(--line);border-radius:3px;padding:8px}
.fr>img{width:52px;height:52px;object-fit:contain;grid-row:span 3;align-self:start}
.fr-t{display:flex;align-items:center;gap:8px}
.fr-t b{flex:1;font:600 15px/1.2 var(--body)}
.fr-t .count{font-size:12px}
.fr .io{font-size:11.5px}
.fr .costs{grid-column:1/-1}
.fr .card-f{grid-column:1/-1}
.fr .state{grid-column:1/-1}
.fr.locked{opacity:.55}
.fr.locked>img{filter:grayscale(1)}
.mapmsg{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;max-width:calc(100% - 20px)}
.mapmsg .placing{margin:0;background:rgba(21,18,14,.94);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.viewsw{position:absolute;right:10px;top:10px;z-index:2}
.viewsw .seg{background:rgba(14,12,10,.9)}
.viewsw .seg button{font-size:13px;padding:5px 9px}
.mapctl{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;gap:6px;align-items:center}
.mapctl .seg{background:rgba(14,12,10,.9)}
.mapctl .ghost{background:rgba(14,12,10,.9)}
.hud{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;gap:8px;align-items:center;background:rgba(14,12,10,.9);border:2px solid var(--line2);border-radius:3px;padding:4px 10px 4px 6px;font:12px var(--mono);color:var(--muted);max-width:calc(100% - 230px)}
.hud img{width:34px;height:28px;object-fit:contain}
.hud b{font:600 14px var(--display);text-transform:uppercase;color:var(--text)}
.hud .hint2{font:10px var(--pixel);text-transform:uppercase;color:var(--faint)}
.infocard{position:absolute;left:10px;bottom:56px;z-index:3;width:330px;max-width:calc(100% - 20px);max-height:calc(100% - 120px);overflow-y:auto;background:rgba(21,18,14,.97);border:2px solid var(--acc);border-radius:3px;padding:12px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
.infocard h3{margin:2px 0 4px;font:700 24px/1 var(--display);text-transform:uppercase}
.infocard .rp{display:block;border:0;padding:0}
.infocard .rp h3{font-size:24px}
.infocard .card-f{margin-top:10px}
.schedpop{position:fixed;right:10px;top:var(--bh,96px);z-index:8;width:340px;max-width:calc(100vw - 20px);max-height:calc(100vh - 120px);overflow-y:auto;box-shadow:4px 4px 0 rgba(0,0,0,.45);border-color:var(--acc)}
.dlg.wide{max-width:900px;max-height:calc(100vh - 40px);overflow-y:auto}
.colhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.colhead .grow{flex:1}
.modesw{position:absolute;left:10px;top:10px;z-index:2}
.modesw .seg{background:rgba(14,12,10,.9)}
.modesw .seg button{font-size:13px;padding:5px 10px}
.tipcard{display:grid;gap:2px;padding:0 0 10px;margin-bottom:10px;border-bottom:2px solid var(--line)}
.tipcard b{font:700 20px/1.1 var(--display);text-transform:uppercase;color:var(--text)}
.tipcard span{font-size:13px;color:var(--muted)}
.gtoast{position:fixed;left:50%;top:var(--bh,96px);transform:translateX(-50%);z-index:9;max-width:min(520px,calc(100vw - 24px));background:#0e0d0b;border:2px solid var(--acc);border-radius:3px;padding:8px 12px;display:grid;gap:2px;font-size:13px;color:#c9c0b0;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.gtoast b{font:600 16px var(--display);text-transform:uppercase;color:#fff}
button.rc{font:inherit;font:12px var(--mono);color:inherit;cursor:pointer}
.h1{font:700 30px/1 var(--display);text-transform:uppercase;margin:0}
#mapview .toast{left:50%;transform:translateX(-50%);top:62px;max-width:min(560px,calc(100% - 20px));text-align:center;z-index:3}
@media (max-width:640px){
  .sidebar{width:60px;padding:4px 3px 10px}
  .sb{font-size:9px;padding:4px 1px 3px}
  .sb img{width:34px;height:34px}
  .sb-pair{grid-template-columns:1fr}
  .sb-h{font-size:8px}
  .viewsw .seg button{font-size:11px;padding:4px 6px}
  .hud{max-width:calc(100% - 20px);bottom:52px}
  .hud .hint2{display:none}
  .infocard{bottom:100px}
  .mapctl .seg button{padding:4px 8px}
}
/* ===== Colony screen: modern look ===== */
#scr-colony{
  --m-font:"Inter","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --m-num:"Inter","Barlow",system-ui,sans-serif;
  --display:var(--m-font); --pixel:var(--m-font); --mono:var(--m-num); --body:var(--m-font);
  --m-card:#1c1a17; --m-card2:#24211d; --m-edge:rgba(255,255,255,.07); --m-edge2:rgba(255,255,255,.12);
  --m-shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25);
  --m-r:14px; --m-r2:10px;
  background:radial-gradient(1200px 600px at 20% -10%,var(--acc-soft),transparent 60%),var(--bg);
  font-family:var(--m-font); font-feature-settings:"tnum" 1,"cv11" 1;
}
#scr-colony .pagebody{gap:16px;padding-top:20px}
/* era ribbon */
#scr-colony .ribbon{font:500 12px var(--m-num);color:var(--muted)}
#scr-colony .bar{height:6px;border-radius:99px;background:var(--m-card2);overflow:visible}
#scr-colony .bar .fill{border-radius:99px;background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 60%,#fff))}
#scr-colony .bar .mk{width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border-width:2px}
#scr-colony .bar .now{width:4px;border-radius:2px;top:-4px;bottom:-4px}
#scr-colony .eras{font-size:12.5px}
#scr-colony .eras span{padding:3px 10px;border-radius:99px;background:var(--m-card)}
#scr-colony .eras span.cur{background:var(--acc-soft);box-shadow:inset 0 0 0 1px var(--acc)}
/* panels */
#scr-colony .main{gap:16px}
#scr-colony .panel{background:var(--m-card);border:1px solid var(--m-edge);border-radius:var(--m-r);box-shadow:var(--m-shadow)}
#scr-colony h2{font:600 13px/1 var(--m-font);letter-spacing:0;text-transform:none;color:var(--text)}
#scr-colony .ph{padding:16px 16px 10px}
#scr-colony .sub{font:600 11px var(--m-font);letter-spacing:.06em;color:var(--faint);margin:14px 0 6px}
/* ledger */
#scr-colony .stats,#scr-colony .res{border-bottom:1px solid var(--m-edge)}
#scr-colony .stats{padding:0 16px 12px}
#scr-colony .res{padding:10px 16px 12px}
#scr-colony .row{font-size:13.5px;padding:4px 0}
#scr-colony .row .v{font:600 13.5px var(--m-num)}
#scr-colony .row .r{font:500 11.5px var(--m-num);min-width:44px}
#scr-colony .row .r.pos,#scr-colony .row .r.neg{display:inline-block;text-align:center;padding:1px 6px;border-radius:99px;min-width:0;margin-left:8px}
#scr-colony .row .r.pos{background:rgba(140,199,132,.12)}
#scr-colony .row .r.neg{background:rgba(229,110,87,.12)}
#scr-colony .dot{width:8px;height:8px;border-radius:50%}
/* colony body */
#scr-colony .tb{padding:20px}
#scr-colony .h1{font:700 28px/1.1 var(--m-font);letter-spacing:-.02em;text-transform:none}
#scr-colony .ghost{border:1px solid var(--m-edge2);border-radius:99px;padding:7px 14px;font:500 13px var(--m-font);background:rgba(255,255,255,.02)}
#scr-colony .ghost:hover{background:rgba(255,255,255,.06)}
#scr-colony .regions{gap:8px}
#scr-colony .regions button{border:1px solid var(--m-edge2);border-radius:99px;padding:6px 14px;font:500 13px var(--m-font);background:var(--m-card2)}
#scr-colony .regions button.fog{border-style:dashed;opacity:.7}
#scr-colony .regions button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#scr-colony .rp{border-top:1px solid var(--m-edge);padding-top:20px;gap:24px}
#scr-colony .rp h3{font:700 30px/1.1 var(--m-font);letter-spacing:-.02em;text-transform:none}
#scr-colony .eyebrow{font:600 11px var(--m-font);letter-spacing:.06em}
#scr-colony .tag{font:600 11px var(--m-font);border-radius:99px;padding:3px 10px;letter-spacing:.02em}
#scr-colony .trait{border:0;border-radius:var(--m-r2);background:var(--m-card2);padding:10px 12px}
#scr-colony .meter{height:6px;border:0;border-radius:99px;overflow:hidden}
#scr-colony .meter i{border-radius:99px;background:var(--acc)}
/* building rows / cards */
#scr-colony .hb{border-bottom:1px solid var(--m-edge);padding:12px 0;gap:6px 12px}
#scr-colony .hb .nm{font-weight:600}
#scr-colony .hb .nm img,#scr-colony .q-top img{background:var(--m-card2);border-radius:8px;padding:3px;box-sizing:content-box}
#scr-colony .card{background:var(--m-card2);border:1px solid var(--m-edge);border-radius:var(--m-r2)}
#scr-colony .chip{font:500 12px var(--m-num);border:0;border-radius:6px;background:rgba(255,255,255,.06);padding:4px 8px}
#scr-colony .chip.ok{background:rgba(140,199,132,.12)}
#scr-colony .chip.lack{background:rgba(229,110,87,.12)}
#scr-colony .io{font:500 12.5px var(--m-font)}
#scr-colony .btn{border-radius:99px;padding:8px 16px;font:600 13px var(--m-font);box-shadow:0 2px 10px color-mix(in srgb,var(--acc) 35%,transparent)}
#scr-colony .btn:active{transform:translateY(1px);box-shadow:none}
#scr-colony .btn:disabled{border-radius:99px;box-shadow:none}
#scr-colony .stepper{border:1px solid var(--m-edge2);border-radius:99px;overflow:hidden}
#scr-colony .stepper span{font:600 12px var(--m-num)}
/* work schedule */
#scr-colony .queue ol{padding:0 12px 12px;gap:8px}
#scr-colony .q{border:1px solid var(--m-edge);border-radius:var(--m-r2);background:var(--m-card2);padding:10px 12px}
#scr-colony .q.wait{background:transparent;border-style:dashed}
#scr-colony .kind{font:700 10px var(--m-font);letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:var(--acc-soft)}
#scr-colony .q-name{font-weight:600}
#scr-colony .q-left{font:600 12px var(--m-num)}
#scr-colony .prog{height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
#scr-colony .prog i{border-radius:99px;background:var(--acc)}

.banner .rc .d{font:600 10.5px var(--m-font);padding:1px 5px;border-radius:99px}

.banner .rc .d.neg{background:rgba(229,110,87,.14)}

.banner .bn-tabs .badge{min-width:18px;padding:0 6px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:700 10.5px/18px var(--m-font);text-align:center}
@media (max-width:900px){

const hash=(a,b)=>{ const s=Math.sin(a*127.1+b*311.7)*43758.5453; return s-Math.floor(s); };
function mkc(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function spr(w,h,draw){ const c=mkc(w,h), g=c.getContext('2d'); const p=(x,y,W,H,col)=>{ g.fillStyle=col; g.fillRect(x,y,W||1,H||1); }; draw(p,g); return c; }
function disc(p,cx,cy,r,col){ for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r+r*.8) p(cx+x,cy+y,1,1,col); }
function ring(p,cx,cy,r,col){ for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++){ const d=x*x+y*y; if(d<=r*r+r*.8&&d>=(r-1)*(r-1)+(r-1)*.8) p(cx+x,cy+y,1,1,col); } }

function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, s=t=>t*t*(3-2*t);
  const a=hash(xi,yi), b=hash(xi+1,yi), c=hash(xi,yi+1), d=hash(xi+1,yi+1), u=s(xf), v=s(yf);

function surcharge(rid,id){ if(rid==='home') return 1; if(REG[rid].where==='earth') return 1.25; return B[id].cat==='space'?1:2; }
function baseCost(id){ const d=B[id], k=nOf(id)+queuedCount(id), s=d.scale||1.1, f=1-Math.min(.5,allFx().cost||0), o={}; for(const [r,v] of Object.entries(d.cost)) o[r]=Math.ceil(v*Math.pow(s,k)*f); return o; }

function bonusX(rid,id){ const bo=REG[rid].bonus; if(!bo||!bo.x) return 1; if(bo.ids&&bo.ids.includes(id)) return bo.x; if(bo.cat&&B[id].cat===bo.cat) return bo.x; return 1; }
function sitesUsed(rid,dep){ return ORDER.filter(id=>B[id].deposit===dep).reduce((a,id)=>a+nAt(rid,id)+qAt(rid,id),0); }

/* ============ SIMULATION ============ */
function flows(fr=1){
  const st={...S.res};
  const fx=allFx(), gm=1+(fx.all||0);
  const items=[];
  for(const rid in S.bld) for(const id of ORDER){ const b=S.bld[rid][id]; if(b&&b.n) items.push({rid,id,b,d:B[id],x:bonusX(rid,id)}); }
  let jobs=0; for(const it of items) if(it.d.workers) jobs+=it.b.on*it.d.workers;
  const staff = jobs>0?Math.min(1,S.pop/jobs):1;
  const employed = Math.min(S.pop,jobs);
  const eff={};
  const inRatio=(inp,k)=>{ let r=1, why=null; if(inp&&k>0) for(const x in inp){ const need=inp[x]*k*fr; const q=(st[x]||0)/need; if(q<r){r=q; why=x;} } return [Math.max(0,r),why]; };
  const use=(inp,k)=>{ if(inp) for(const x in inp) st[x]=Math.max(0,st[x]-inp[x]*k*fr); };
  let supply=0, demand=0;
  for(const it of items){ const {d,b}=it; if(!b.on) continue;
    if(d.power>0){ const [r,why]=inRatio(d.in,b.on*staff); const e=staff*r;
      use(d.in,b.on*e); supply+=d.power*b.on*e*it.x*(1+(fx.power||0));
      eff[it.rid+':'+it.id]={e, why: staff<1&&staff<=r ? 'workers' : (r<1?RES[why].toLowerCase():null)};
    } else if(d.power<0) demand+=-d.power*b.on;
  }
  const pr = demand>0?Math.min(1,supply/demand):1;
  for(const it of items){ const {d,b}=it; if(!b.on||d.power>0) continue;
    const sf=d.workers?staff:1, pf=d.power<0?pr:1;
    let e=sf*pf, why=null;
    if(sf<1&&sf<=pf) why='workers'; else if(pf<1) why='power';
    if(d.out){ const [r,w]=inRatio(d.in,b.on*e); if(r<1) why=RES[w].toLowerCase(); e*=r; use(d.in,b.on*e);
      for(const x in d.out) st[x]=(st[x]||0)+d.out[x]*b.on*e*(gm+(fx[d.deposit?'extract':d.cat==='science'?'rp':d.cat]||0))*it.x*fr; }
    eff[it.rid+':'+it.id]={e,why};
  }
  st.money+=employed*wage()*fr*(1+(fx.money||0));
  return {st,jobs,staff,employed,supply,demand,pr,mult:gm,fx,eff};
}
const daysIn=m=>new Date(1900+Math.floor(m/12),m%12+1,0).getDate();
function tick(){ // one day
  const dim=daysIn(S.month), fr=1/dim;
  S.res=flows(fr).st;
  const c=crews(); const done=[];
  S.queue.slice(0,c).forEach(q=>{ q.left-=fr; if(q.left<=1e-6) done.push(q); });
  for(const q of done){ S.queue.splice(S.queue.indexOf(q),1); complete(q); }
  for(const v of [...S.voyages]){ v.left-=fr; if(v.left<=1e-6){ S.voyages.splice(S.voyages.indexOf(v),1); arrive(v); } }
  for(const k in S.res) if(S.res[k]>0) S.seen[k]=true;
  S.day=(S.day||0)+1;
  if(S.day>=dim){ // end of month
    S.day=0; S.month++;
    const h=housing(); if(S.pop<h) S.pop=Math.min(h, S.pop+Math.max(1,Math.ceil((h-S.pop)*0.08)));
    save();
  }
}
function fmtLeft(m){ const d=Math.max(1,Math.ceil(m*30-1e-6)); if(d<30) return d+(d===1?' day':' days'); const mo=Math.floor(d/30), r=d%30; return mo+' mo'+(r?' '+r+' d':''); }
function complete(q){
  if(q.kind==='build'){
    const r=S.bld[q.rid]||(S.bld[q.rid]={}); const b=r[q.id]||(r[q.id]={n:0,on:0}); b.n++; b.on++; if(q.tile!=null){ if(!S.at) S.at={}; S.at[q.tile]={id:q.id,rid:q.rid}; }
    log(`${B[q.id].name} completed in ${REG[q.rid].name}.`);
  } else if(q.kind==='rocket'){ S.items.rocket++; log('A rocket rolls out to the pad.'); }
  else if(q.kind==='module'){ S.modules[q.id]=true; log(`Starship module finished: ${MODS[q.id].name}.`,true); }
  else if(q.kind==='exp'){
    const e=REG[q.id]; S.explored[q.id]=true;
    if(e.reward) for(const [k,v] of Object.entries(e.reward)) S.res[k]+=v;
    const found=Object.entries(e.dep).map(([k,v])=>`${v} ${DEPOSITS[k].toLowerCase()}`).join(', ');
    log(`Survey of ${e.name} returns.${found?' Found '+found+'.':''}${e.reward?` +${e.reward.rp} research.`:''}${e.plots?` ${e.plots} building plot${e.plots>1?'s':''}.`:''}`, e.where==='space');
  }
}
function arrive(v){
  const d=DESTS[v.dest]; const first=Object.keys(S.reached).length===0;
  S.reached[v.dest]=S.month;
  log(`Starship arrives at ${d.name}. ${d.name} colony founded.`,true);
  showWin(v.dest, first);
}

function stepCar(dx,dy){

function findPath(from,to,k){
  if(!canEnter(k,to)) return null;
  const prev=new Int32Array(TL.length).fill(-1); prev[from]=from; const q=[from]; let h=0;
  while(h<q.length){ const c=q[h++]; if(c===to) break; const {x,y}=TL[c];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue; const n=tI(nx,ny);
      if(prev[n]!==-1||!canEnter(k,n)) continue; prev[n]=c; q.push(n); } }
  if(prev[to]===-1) return null;
  const path=[]; for(let c=to;c!==from;c=prev[c]) path.push(c); return path.reverse();
}

/* ============ RULES ============ */
function canBuildAt(id,rid){
  const d=B[id], R=REG[rid];
  if(d.tech&&!T(d.tech)) return 'Not researched yet.';
  if(d.max&&nOf(id)+queuedCount(id)>=d.max) return nOf(id)?'Already built.':'Already scheduled.';
  if(d.deposit){
    const cap=depCap(rid,d.deposit), nm=DEPOSITS[d.deposit].toLowerCase();
    if(!cap){ if(R.where==='space') return isExplored(rid)?`No ${nm} here.`:'Not surveyed yet.'; return R.dep[d.deposit]?`No ${nm} found here yet. Drive around to find it.`:`No ${nm} here.`; }
    if(sitesUsed(rid,d.deposit)>=cap) return `All ${cap} known ${nm} sites are taken.`;
  } else {
    if(d.site&&d.site!==rid) return `Only in ${REG[d.site].name}.`;
    if(R.where==='space'&&d.site!==rid) return 'Only extractors can go here.';
    if(!R.plots) return 'No building plots here.';
    if(!isExplored(rid)) return R.where==='space'?'Not surveyed yet.':'Chart this region first.';
    if(plotsUsed(rid)>=R.plots) return `All ${R.plots} plots are in use.`;
  }
  if(!afford(costAt(id,rid))) return 'Not enough resources.';
  return null;
}
function validAt(id,rid){ const w=canBuildAt(id,rid); return !w||w==='Not enough resources.'; }
function placeReason(id){
  const d=B[id];
  if(d.tech&&!T(d.tech)) return 'Not researched yet.';
  if(d.max&&nOf(id)+queuedCount(id)>=d.max) return nOf(id)?'Already built.':'Already scheduled.';
  if(Object.keys(REG).some(r=>validAt(id,r))) return null;
  if(d.deposit) return `No free ${DEPOSITS[d.deposit].toLowerCase()} sites. Drive around to find more.`;
  if(d.site) return `Needs ${REG[d.site].name} surveyed.`;
  return 'No free building plots. Chart new regions.';
}
function expState(rid){
  if(isExplored(rid)) return 'done';
  if(REG[rid].where==='earth') return carOK(needCar(rid))?'open':'locked';
  if(S.queue.some(q=>q.kind==='exp'&&q.id===rid)) return 'queued';
  if(REG[rid].tech&&!T(REG[rid].tech)) return 'locked';
  return 'open';
}
function modReason(id){
  if(S.modules[id]) return 'Built.';
  if(S.queue.some(q=>q.kind==='module'&&q.id===id)) return 'Scheduled.';
  if(!T('starship')) return 'Needs Starship Design.';
  if(!nOf('shipyard')) return 'Needs the Orbital Shipyard.';
  if(!afford(modCost(id))) return 'Not enough resources.';
  return null;
}
function rocketReason(){
  if(!T('rocketry')) return 'Needs Rocketry.';
  if(!nOf('launchpad')) return 'Needs a Launch Complex.';
  if(!afford(rocketCost())) return 'Not enough resources.';
  return null;
}

function regionSub(rid){
  const s=expState(rid);
  if(REG[rid].where==='earth'){
    if(s==='locked') return 'Needs '+CARS[needCar(rid)].name;
    if(s==='open') return `Charted ${Math.round(chartPct(rid)*100)}%`;
  } else {
    if(s==='locked') return 'Needs '+TECHS[REG[rid].tech].name;
    if(s==='queued'){ const q=S.queue.find(q=>q.kind==='exp'&&q.id===rid); return `Survey · ${fmtLeft(q.left)}`; }
    if(s==='open') return 'Unsurveyed';
  }
  let n=0; for(const id of ORDER) n+=nAt(rid,id);
  return n?`${n} building${n>1?'s':''}`:'Charted';
}

/* ---------- exact-tile placement ---------- */
function occupied(i){ return i===RT.home.anchor || !!(S.at&&S.at[i]) || S.queue.some(q=>q.kind==='build'&&q.tile===i); }
function openSite(i,k){ const j=DEPAT.get(i); return j!=null&&S.found.includes(j)&&DEPT[j].k===k&&!occupied(i); }
function tileWhy(id,i){
  const t=TL[i], rid=t.rid, d=B[id];
  if(!S.fog[i]) return 'That ground is uncharted.';
  const w=canBuildAt(id,rid); if(w) return w;
  if(occupied(i)) return 'Something is already built there.';
  if(d.deposit){ if(!openSite(i,d.deposit)) return `Click an open ${DEPOSITS[d.deposit].toLowerCase()} site (the glowing icons).`; }
  else if(DEPAT.has(i)) return S.found.includes(DEPAT.get(i))?'That spot is a deposit site. Save it for a mine.':'Something glints there. Drive next to it first.';
  return null;
}
function snapTile(id,i){ // extractors: forgive a click one tile away from the site
  const d=B[id]; if(!d.deposit||openSite(i,d.deposit)) return i;
  const {x,y}=TL[i]; let best=i, bd=9;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!inB(x+dx,y+dy)) continue; const n=tI(x+dx,y+dy); if(openSite(n,d.deposit)&&dx*dx+dy*dy<bd){ bd=dx*dx+dy*dy; best=n; } }
  return best;
}
function autoTile(id,rid){ // used by "Build here" buttons and old saves
  if(REG[rid].where!=='earth') return null; const d=B[id], R=RT[rid];
  if(d.deposit){ const s=foundOf(rid,d.deposit).map(j=>DEPT[j].i).find(i=>!occupied(i)); if(s!=null) return s; }
  else { const p=R.plots.find(i=>!occupied(i)&&!DEPAT.has(i)); if(p!=null) return p; }
  const f=R.tiles.find(i=>!occupied(i)&&!DEPAT.has(i)); return f==null?null:f;
}
function syncTiles(){ // make sure every Earth building and scaffold has a tile
  if(!S.at) S.at={};
  for(const k of Object.keys(S.at)){ const a=S.at[k]; if(!S.bld[a.rid]||!S.bld[a.rid][a.id]) delete S.at[k]; }
  for(const rid of EARTH) for(const id in (S.bld[rid]||{})){ const n=S.bld[rid][id].n; const mine=Object.keys(S.at).filter(k=>S.at[k].rid===rid&&S.at[k].id===id);
    for(let c=n;c<mine.length;c++) delete S.at[mine[c]];
    for(let c=mine.length;c<n;c++){ const t=autoTile(id,rid); if(t==null) break; S.at[t]={id,rid}; } }
  for(const q of S.queue) if(q.kind==='build'&&REG[q.rid].where==='earth'&&q.tile==null){ const t=autoTile(q.id,q.rid); if(t!=null) q.tile=t; }
}
function placeAt(i){
  const id=ui.placing; i=snapTile(id,i); const why=tileWhy(id,i), rid=TL[i].rid;
  if(why){ ui.placeMsg=why; toast(why); return; }
  buildAt(id,rid,i); ui.placeMsg=`Scheduled in ${REG[rid].name}.`;
  if(!ui.shift){ ui.placing=null; endPlacing(); }
}
function endPlacing(){ if(ui.zBefore){ CAM.earth.z=ui.zBefore; ui.zBefore=null; clampCam('earth'); } }
function placeIn(rid){
  const why=canBuildAt(ui.placing,rid);
  if(!why){ buildAt(ui.placing,rid); ui.placeMsg=`Scheduled in ${REG[rid].name}.`; if(!ui.shift){ ui.placing=null; endPlacing(); } }
  else ui.placeMsg=`${REG[rid].name}: ${why}`;
}

function patch(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){ a.replaceWith(b); return; }
  if(a.nodeType===3){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  if(a.nodeType!==1) return;
  if(a.hasAttribute('data-keep')&&b.hasAttribute('data-keep')) return;
  for(const at of [...a.attributes]) if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for(const at of [...b.attributes]) if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name,at.value);
  kids(a,b);
}
function kids(a,b){
  const ac=[...a.childNodes], bc=[...b.childNodes];
  bc.forEach((n,i)=>{ if(i<ac.length) patch(ac[i],n); else a.appendChild(n); });
  for(let i=bc.length;i<ac.length;i++) ac[i].remove();
}
function put(id,html){ const el=document.getElementById(id); const t=document.createElement(el.tagName); t.innerHTML=html; kids(el,t); }

/* ---------- map input: tap, drag, wheel, pinch, hover ---------- */
function hitTest(v,wx,wy){
  if(v==='earth'){ const x=Math.floor(wx/TS), y=Math.floor(wy/TS); return inB(x,y)?tI(x,y):null; }
  if(v==='solar'){ let best=null, bd=1e9; for(const b of solarBodies()){ const d=Math.hypot(wx-b.x,wy-b.y); if(d<b.r+6&&d<bd&&!(b.id==='leo'&&d<SOL.earth.r+1)){ bd=d; best=b.id; } }
    if(!best){ for(const b of solarBodies()){ if(b.id==='earth'||b.id==='leo') continue; const ic=spaceIcons(b.id); if(ic.length&&wy>=b.y+b.r+3&&wy<=b.y+b.r+11&&Math.abs(wx-b.x)<=ic.length*5) return b.id; } }
    return best; }
  for(const [id,d] of Object.entries(DESTS)){ const P=starPos(d); if(Math.hypot(wx-P.x,wy-P.y)<P.r+7) return 'star:'+id; }

}

    return `${d.name}|${d.ly} light-years · ${Math.round(d.ly*10)} years at 0.1c|${S.reached[k]!=null?'Colony founded '+yearOf(S.reached[k]):fly?'Starship arrives '+yearOf(S.month+fly.left):'Tap to plan a launch'}`; }

  if(st==='done'){ l.push(R.trait); if(R.plots) l.push(`${R.plots-plotsUsed(id)} of ${R.plots} plots free`); }
  if(ui.placing){ const w=canBuildAt(ui.placing,id); l.push(w?`Can't place ${B[ui.placing].name}: ${w}`:`Tap to place ${B[ui.placing].name} here`); }

function tipAt(v,wx,wy){

    if(!S.fog[i]) return `Uncharted|${canEnter(S.car.kind,i)?'Tap to drive into the unknown':`The ${CARS[S.car.kind].name} may not be able to go there`}`;
    if(i===carTile()){ const C=CARS[S.car.kind]; return `${C.name}|${C.desc}|${fmt(S.res[C.fuel]||0)} ${RES[C.fuel].toLowerCase()} on hand · ${carUse(S.car.kind)} per tile`; }

let lpTimer=0;
function attachMapInput(){

    ${built||q?'':`<div class="costs">${costChips(modCost(id))}</div>`}</div>`; }).join('');
  const dests=Object.entries(DESTS).map(([id,d])=>{ const reached=S.reached[id]!=null, flying=S.voyages.some(v=>v.dest===id);
    return `<article class="card ${reached?'done':''}"><div class="card-h"><h4>${d.name}</h4><span class="time">${d.ly} ly</span></div>
    <p class="io">${Math.round(d.ly*10)} years at 0.1c</p>
    <div class="card-f"><span class="grow"></span>${reached?`<span class="tag on">Colony ${yearOf(S.reached[id])}</span>`:flying?'<span class="tag">In flight</span>':`<button class="btn" data-act="launch" data-id="${id}" ${launchReady()?'':'disabled'}>Launch</button>`}</div></article>`; }).join('');
  const voys=S.voyages.map(v=>{ const d=DESTS[v.dest], p=(1-v.left/v.total)*100;
    return `<div class="voy"><div class="q-top"><span class="kind">VOYAGE</span><span class="q-name">${d.name}</span><span class="q-left">arrives ${yearOf(S.month+v.left)}</span></div>
    <div class="q-bot"><div class="prog"><i style="width:${p.toFixed(1)}%"></i></div><span class="q-left">${(v.left/12).toFixed(1)} yr</span></div></div>`; }).join('');
  return `<div class="section"><div class="cat"><h3>Launch vehicles</h3></div>
    <article class="card" style="max-width:520px"><div class="card-h"><h4>Rocket</h4><span class="count">${S.items.rocket} on hand</span></div>
    <p class="desc">Assembled at the Launch Complex${pad?` in ${REG[pad].name}`:''}. Space surveys consume them.${bkOf(pad)==='highlands'?' Equatorial site: 30% cheaper.':''}</p>
    <div class="costs">${costChips(rc)}</div>
    <div class="card-f"><span class="time">${ROCKET.time} mo</span><span class="grow"></span><button class="btn" data-act="rocket" ${rr?'disabled':''} title="${rr||''}">Assemble</button></div>
    ${rr&&rr!=='Not enough resources.'?`<p class="state">${rr}</p>`:''}</article></div>
  <div class="section"><div class="cat"><h3>Starship modules</h3></div><div class="mods">${mods}</div></div>
  <div class="section"><div class="cat"><h3>Launch control</h3></div>
    <p class="note">Launch needs all five modules and <span class="chip ${S.res.he3>=LAUNCH_HE3?'ok':'lack'}">${LAUNCH_HE3} helium-3</span> of fuel. Each launch uses up the modules, so the next ship starts from scratch.</p>
    <div class="dests">${dests}</div></div>
  ${voys?`<div class="section"><div class="cat"><h3>In flight</h3></div>${voys}</div>`:''}`;
}

/* ---------- Queue & log ---------- */
function renderQueue(id,pop){
  const c=crews();
  const lab={build:'BUILD',exp:'SURVEY',rocket:'ROCKET',module:'SHIPYARD'};
  const name=q=>q.kind==='build'?`${B[q.id].name} <span style="color:var(--faint);font-weight:400">· ${REG[q.rid].name}</span>`:q.kind==='exp'?REG[q.id].name:q.kind==='rocket'?'Rocket':MODS[q.id].name;
  const ico={build:q=>q.id,exp:()=>'logo',rocket:()=>'launchpad',module:()=>'shipyard'};
  const items=S.queue.map((q,i)=>{ const on=i<c, p=(1-q.left/q.total)*100;
    return `<li class="q ${on?'':'wait'}"><div class="q-top">${icon(ico[q.kind](q))}<span class="kind">${lab[q.kind]}</span><span class="q-name">${name(q)}</span><span class="q-left">${on?fmtLeft(q.left):'waiting'}</span></div>
    <div class="q-bot"><div class="prog"><i style="width:${p.toFixed(1)}%"></i></div>
    <button class="ic" data-act="up" data-uid="${q.uid}" ${i===0?'disabled':''} aria-label="Move up">▲</button>
    <button class="ic" data-act="down" data-uid="${q.uid}" ${i===S.queue.length-1?'disabled':''} aria-label="Move down">▼</button>
    <button class="ic" data-act="cancel" data-uid="${q.uid}" aria-label="Cancel" title="${q.left>=q.total-1e-9?'Full refund':'Half refund'}">✕</button></div></li>`; }).join('');
  put(id,`<div class="ph"><h2>Work schedule</h2><span class="crews">${Math.min(c,S.queue.length)}/${c} crews busy</span>${pop?'<button class="ic" data-act="sched" aria-label="Close" style="width:28px;height:26px">✕</button>':''}</div>
  ${items?`<ol>${items}</ol>`:'<p class="empty">No projects scheduled. Idle crews are wasted months.</p>'}`);
}
function renderLog(){
  put('log',`<div class="ph"><h2>Dispatches</h2></div><ol>${S.log.slice(0,40).map(l=>`<li class="${l.big?'big':''}"><time>${dateStr(l.m)}</time><span>${l.t}</span></li>`).join('')}</ol>`);
}


/* ============ LOOP ============ */
let acc=0, last=performance.now();
function loop(){
  const now=performance.now(); const dt=Math.min(1000,now-last); last=now;
  if(S.speed&&modal.hidden){ acc+=dt*S.speed; let n=0; while(acc>=5000&&n<40){ acc-=5000; tick(); n++; } if(n>=40) acc=0; if(n) render(); }
}
function frame(now){
  requestAnimationFrame(frame);
  if(!S) return;
  const onMap=ui.screen==='map'&&!!(MAPEL&&MAPEL.isConnected&&CV.width);
  if(onMap&&ui.view==='earth'&&now-mv.t0>=mv.dur){
    if(ui.path.length){ const n=ui.path[0], dx=TL[n].x-S.car.x, dy=TL[n].y-S.car.y;
      if(Math.abs(dx)+Math.abs(dy)===1&&stepCar(dx,dy)) ui.path.shift(); else ui.path=[]; }
    else for(const key of KEYS){ const d=DIRS[key]; if(!d) continue; if(!stepCar(d[0],d[1])) KEYS.clear(); break; }
  }
  if(needRender&&now-lastRender>180){ render(); if(now-lastSave>2000){ save(); lastSave=now; } }
  if(!onMap) return;
  if(ui.view==='earth'&&ui.follow){ const [cx,cy]=carPos(now), c=CAM.earth; c.x+=(cx+32-c.x)*.18; c.y+=(cy+32-c.y)*.18; clampCam('earth'); }
  drawMap(now);
}
async function start(data){
  makeSprites(); makeSpaceSprites(); makeFogTiles();
  await loadArt(); SOLARC=paintSolar(); STARSC=paintStars();
  S=migrate((data&&data.state)||load())||newGame();
  if(OLDSAVE) S.log.unshift({m:0,t:'A new, much larger world. Saves from the old map were set aside and could not be carried over.',big:true});
  for(const k in RES) if(k!=='rocket'&&S.res[k]==null) S.res[k]=0;
  DEPT.forEach((d,j)=>{ if(d.rid==='home'&&!S.found.includes(j)) S.found.push(j); });
  syncTiles();
  if(![0,1,10,100,1000].includes(S.speed)) S.speed=1; if(S.day==null) S.day=0;
  if(!S.fastBuild){ for(const q of S.queue) if(q.kind==='build'){ q.left*=BUILD_SPEED; q.total*=BUILD_SPEED; } S.fastBuild=true; }
  resetCams();
  render();
  setInterval(loop,100);
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ needRender=true; });
}
try{ window.claude?.hot?.snapshot?.(()=>({state:S})); }catch(e){}
const hot=window.claude?.hot;
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
</script>
